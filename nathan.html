<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nathan Submissions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root{
      --bg0:#070A12;
      --bg1:#0B1226;
      --bg2:#101B3A;

      --glass: rgba(255,255,255,.10);
      --glass2: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.18);

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);

      --good: rgba(52, 211, 153, 1);
      --bad: rgba(248, 113, 113, 1);
      --warn: rgba(250, 204, 21, 1);

      --shadow: 0 18px 55px rgba(0,0,0,.55);
      --radius: 22px;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      min-height:100vh;
      background:
        radial-gradient(1100px 600px at 15% 15%, rgba(59,130,246,.25), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(249,115,22,.20), transparent 55%),
        radial-gradient(900px 700px at 55% 90%, rgba(34,197,94,.15), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1) 40%, var(--bg2));
      overflow-x:hidden;
    }

    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .topbar{
      display:flex;
      gap:14px;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 16px;
    }

    .brand{
      display:flex; gap:12px; align-items:center;
    }
    .logo{
      width:44px; height:44px; border-radius:14px;
      background: linear-gradient(135deg, rgba(59,130,246,.85), rgba(249,115,22,.75));
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.18);
    }
    .logo:before{
      content:"";
      position:absolute; inset:-30%;
      background: repeating-linear-gradient(
        90deg,
        rgba(255,255,255,.0) 0 18px,
        rgba(255,255,255,.12) 18px 22px
      );
      transform: rotate(12deg);
    }
    .brand h1{
      font-size: 18px;
      line-height: 1.1;
      margin:0;
      font-weight: 800;
      letter-spacing:.4px;
    }
    .brand p{
      margin:2px 0 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .status{
      display:flex;
      gap:10px;
      align-items:center;
      color: var(--muted);
      font-size: 12px;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: rgba(255,255,255,.25);
      box-shadow: 0 0 0 4px rgba(255,255,255,.06);
    }
    .dot.ok{ background: rgba(52,211,153,.95); box-shadow: 0 0 0 4px rgba(52,211,153,.12); }
    .dot.bad{ background: rgba(248,113,113,.95); box-shadow: 0 0 0 4px rgba(248,113,113,.12); }

    .card{
      background: linear-gradient(180deg, var(--glass), var(--glass2));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .hero{
      padding: 18px 18px 16px;
      display:flex;
      gap: 14px;
      align-items:flex-end;
      justify-content: space-between;
      border-bottom:1px solid rgba(255,255,255,.10);
    }
    .hero .title{
      display:flex; flex-direction:column; gap:6px;
    }
    .hero .big{
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .2px;
      margin:0;
    }
    .pillrow{
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .pill{
      font-size: 12px;
      color: rgba(255,255,255,.82);
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.07);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .tableWrap{
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing: 0;
      min-width: 980px;
    }
    thead th{
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(12,18,40,.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.12);
      font-size: 12px;
      letter-spacing:.35px;
      text-transform: uppercase;
      color: rgba(255,255,255,.72);
      padding: 12px 12px;
      text-align:left;
      white-space:nowrap;
    }
    tbody td{
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      white-space:nowrap;
      font-size: 13px;
      color: rgba(255,255,255,.88);
      vertical-align:middle;
    }
    tbody tr:hover td{ background: rgba(255,255,255,.04); }

    .pickNum{
      font-weight:800;
      color: rgba(255,255,255,.82);
    }

    select{
      width: 260px;
      max-width: 100%;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.16);
      color: rgba(255,255,255,.92);
      padding: 10px 10px;
      border-radius: 14px;
      outline:none;
    }
    option{ color:#0b1022; }

    .meta{
      color: rgba(255,255,255,.84);
      font-variant-numeric: tabular-nums;
    }
    .mutedText{ color: var(--muted); }

    /* ✅ FIX: keep badge right next to the value (not spaced to the far right) */
    .cellFlex{
      display:inline-flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      max-width: 100%;
    }
    .value{
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width: 26px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      font-weight: 900;
      line-height: 1;
      font-size: 14px;
      flex: 0 0 auto;
    }
    .badge.good{
      border-color: rgba(52,211,153,.35);
      background: rgba(52,211,153,.14);
      color: rgba(52,211,153,1);
    }
    .badge.bad{
      border-color: rgba(248,113,113,.35);
      background: rgba(248,113,113,.14);
      color: rgba(248,113,113,1);
    }
    .badge.arrow{
      width: 30px;
      font-size: 16px;
      border-color: rgba(248,113,113,.35);
      background: rgba(248,113,113,.14);
      color: rgba(248,113,113,1);
    }

    .btn{
      cursor:pointer;
      border: 1px solid rgba(255,255,255,.16);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.06));
      color: rgba(255,255,255,.92);
      padding: 10px 12px;
      border-radius: 14px;
      font-weight: 700;
      letter-spacing:.2px;
      transition: transform .08s ease, border-color .15s ease;
      user-select:none;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.22); }
    .btn:active{ transform: translateY(0px); }
    .btn.primary{
      border-color: rgba(59,130,246,.40);
      background: linear-gradient(180deg, rgba(59,130,246,.38), rgba(59,130,246,.16));
    }
    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      transform:none;
    }

    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(10,14,28,.78);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow);
      border-radius: 999px;
      padding: 10px 14px;
      color: rgba(255,255,255,.92);
      font-size: 13px;
      display:none;
      gap:10px;
      align-items:center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      max-width: calc(100vw - 24px);
    }
    .toast.show{ display:flex; }
    .toast .chip{ width:10px; height:10px; border-radius:50%; background: rgba(255,255,255,.25); }
    .toast.ok .chip{ background: rgba(52,211,153,.95); }
    .toast.bad .chip{ background: rgba(248,113,113,.95); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Work NFL Picker</h1>
          <p>Submit page</p>
        </div>
      </div>
      <div class="status">
        <span id="dot" class="dot"></span>
        <span id="statusText">Loading…</span>
      </div>
    </div>

    <div class="card">
      <div class="hero">
        <div class="title">
          <p class="mutedText" style="margin:0;font-size:12px;letter-spacing:.35px;text-transform:uppercase;">Player</p>
          <h2 id="playerName" class="big">NATHAN</h2>
          <div class="pillrow">
            <span class="pill">5 picks</span>
            <span class="pill">Auto-fill</span>
            <span class="pill">Compare to Current Selection after submit</span>
          </div>
        </div>
        <div class="status" style="justify-content:flex-end;">
          <span class="mutedText" id="currentStatus">Current Selection: loading…</span>
        </div>
      </div>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:80px;">Pick</th>
              <th style="width:320px;">Selection</th>
              <th>Position</th>
              <th>Age</th>
              <th>Points</th>
              <th>Conference</th>
              <th>Division</th>
              <th style="min-width:240px;">Team</th>
              <th style="width:160px;">Submit</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"><span class="chip"></span><span id="toastText"></span></div>

<script>
/*** CONFIG ***/
const PICKS_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7-NfeL-PNHti9NS4z2Rk_i1MRyNwcrF8yYTA6VzpvFcdg3j5KxHQp2SPltrkuhgNXB9Q3vE0iU75K/pub?gid=746956238&single=true&output=csv";

const DATA_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7-NfeL-PNHti9NS4z2Rk_i1MRyNwcrF8yYTA6VzpvFcdg3j5KxHQp2SPltrkuhgNXB9Q3vE0iU75K/pub?gid=0&single=true&output=csv";

const CURRENT_SELECTION_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vR7-NfeL-PNHti9NS4z2Rk_i1MRyNwcrF8yYTA6VzpvFcdg3j5KxHQp2SPltrkuhgNXB9Q3vE0iU75K/pub?gid=2147341155&single=true&output=csv";

// Apps Script Web App URL (/exec):
const SCRIPT_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxspTZqBOMoMLSEaVXDL5ibAx5iOhRuv6uwqEx0OC_XKQMCK5XtcSjLifp1XdxTCjlfSA/exec";

// This page is for Nathan:
const PLAYER_KEY = "nathan";
const PLAYER_NAME_CELL = "A1";
/*** END CONFIG ***/

const elRows = document.getElementById('rows');
const elPlayerName = document.getElementById('playerName');
const elDot = document.getElementById('dot');
const elStatus = document.getElementById('statusText');
const elToast = document.getElementById('toast');
const elToastText = document.getElementById('toastText');
const elCurrentStatus = document.getElementById('currentStatus');

let dataByName = new Map();
let allNames = [];
let currentSelection = null; // {position, age, points, conference, division, team}

function setStatus(ok, text){
  elDot.className = "dot " + (ok ? "ok" : "bad");
  elStatus.textContent = text;
}

function toast(ok, msg){
  elToast.className = "toast show " + (ok ? "ok" : "bad");
  elToastText.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => elToast.className = "toast", 2400);
}

function withBuster(url){
  return url + (url.includes("?") ? "&" : "?") + "_=" + Date.now();
}

function parseCSV(url){
  return new Promise((resolve, reject) => {
    Papa.parse(withBuster(url), {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (res) => resolve(res.data),
      error: (err) => reject(err)
    });
  });
}

function fetchText(url){
  return fetch(withBuster(url), { cache: "no-store" }).then(r => r.text());
}

function csvTextToGrid(text){
  return text.trim().split(/\r?\n/).map(line =>
    line.split(',').map(v => v.replace(/^"|"$/g,'').trim())
  );
}

function getA1FromGrid(grid, a1){
  const m = String(a1).toUpperCase().match(/^([A-Z]+)(\d+)$/);
  if (!m) return "";
  const colLetters = m[1];
  const rowIdx = parseInt(m[2],10) - 1;

  let colIdx = 0;
  for (let i=0; i<colLetters.length; i++){
    colIdx = colIdx * 26 + (colLetters.charCodeAt(i) - 64);
  }
  colIdx -= 1;

  return (grid[rowIdx] && grid[rowIdx][colIdx]) ? grid[rowIdx][colIdx] : "";
}

function buildDataMap(dataRows){
  const keyFor = (obj, contains) =>
    Object.keys(obj).find(x => x.toLowerCase().includes(contains)) || null;

  dataByName.clear();

  const probe = dataRows[0] || {};
  const nameKey = ("Name" in probe) ? "Name" : keyFor(probe, "name");
  const posKey  = keyFor(probe, "pos");
  const ageKey  = keyFor(probe, "age");
  const ptsKey  = keyFor(probe, "poi");
  const confKey = keyFor(probe, "conf");
  const divKey  = keyFor(probe, "div");
  const teamKey = keyFor(probe, "team");

  for (const r of dataRows){
    const nm = (r[nameKey] || "").trim();
    if (!nm) continue;
    dataByName.set(nm, {
      name: nm,
      position: (posKey ? (r[posKey]||"") : "").trim(),
      age: (ageKey ? (r[ageKey]||"") : "").trim(),
      points: (ptsKey ? (r[ptsKey]||"") : "").trim(),
      conference: (confKey ? (r[confKey]||"") : "").trim(),
      division: (divKey ? (r[divKey]||"") : "").trim(),
      team: (teamKey ? (r[teamKey]||"") : "").trim()
    });
  }

  allNames = Array.from(dataByName.keys()).sort((a,b)=>a.localeCompare(b));
}

function buildCurrentSelection(currentRows){
  const keyFor = (obj, contains) =>
    Object.keys(obj).find(x => x.toLowerCase().includes(contains)) || null;

  const first = (currentRows || []).find(r => Object.values(r).some(v => String(v||"").trim() !== ""));
  if (!first) return null;

  const posKey  = keyFor(first, "pos");
  const ageKey  = keyFor(first, "age");
  const ptsKey  = keyFor(first, "poi");
  const confKey = keyFor(first, "conf");
  const divKey  = keyFor(first, "div");
  const teamKey = keyFor(first, "team");

  return {
    position: (posKey ? (first[posKey]||"") : "").trim(),
    age: (ageKey ? (first[ageKey]||"") : "").trim(),
    points: (ptsKey ? (first[ptsKey]||"") : "").trim(),
    conference: (confKey ? (first[confKey]||"") : "").trim(),
    division: (divKey ? (first[divKey]||"") : "").trim(),
    team: (teamKey ? (first[teamKey]||"") : "").trim()
  };
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function renderValueWithBadge(value, badgeHtml){
  const safe = escapeHtml(value || "—");
  return `<div class="cellFlex"><span class="value">${safe}</span>${badgeHtml || ""}</div>`;
}

function badgeGood(title){ return `<span class="badge good" title="${escapeHtml(title||"Match")}">✓</span>`; }
function badgeBad(title){ return `<span class="badge bad" title="${escapeHtml(title||"No match")}">✗</span>`; }
function badgeArrow(dir, title){ return `<span class="badge arrow" title="${escapeHtml(title||"Higher/Lower")}">${dir}</span>`; }

function toNumberLoose(v){
  const n = parseFloat(String(v||"").replace(/[^0-9.\-]/g,""));
  return Number.isFinite(n) ? n : null;
}

function compareAndMark(tr, picked){
  if (!currentSelection){
    return;
  }

  // Position
  tr._cells.tdPos.innerHTML = renderValueWithBadge(
    picked.position,
    (picked.position && currentSelection.position && picked.position === currentSelection.position)
      ? badgeGood("Position matches current selection")
      : badgeBad("Position does not match current selection")
  );

  // Conference
  tr._cells.tdConf.innerHTML = renderValueWithBadge(
    picked.conference,
    (picked.conference && currentSelection.conference && picked.conference === currentSelection.conference)
      ? badgeGood("Conference matches current selection")
      : badgeBad("Conference does not match current selection")
  );

  // Division
  tr._cells.tdDiv.innerHTML = renderValueWithBadge(
    picked.division,
    (picked.division && currentSelection.division && picked.division === currentSelection.division)
      ? badgeGood("Division matches current selection")
      : badgeBad("Division does not match current selection")
  );

  // Team
  tr._cells.tdTeam.innerHTML = renderValueWithBadge(
    picked.team,
    (picked.team && currentSelection.team && picked.team === currentSelection.team)
      ? badgeGood("Team matches current selection")
      : badgeBad("Team does not match current selection")
  );

  // Age (arrow if wrong)
  const aPick = toNumberLoose(picked.age);
  const aCur  = toNumberLoose(currentSelection.age);
  if (aPick != null && aCur != null && aPick === aCur){
    tr._cells.tdAge.innerHTML = renderValueWithBadge(String(picked.age), badgeGood("Age matches current selection"));
  } else if (aPick != null && aCur != null){
    const dir = (aCur > aPick) ? "↑" : "↓";
    const tip = (aCur > aPick) ? "Current age is higher" : "Current age is lower";
    tr._cells.tdAge.innerHTML = renderValueWithBadge(String(picked.age), badgeArrow(dir, tip));
  } else {
    tr._cells.tdAge.innerHTML = renderValueWithBadge(String(picked.age), badgeBad("Age does not match current selection"));
  }

  // Points (arrow if wrong)
  const pPick = toNumberLoose(picked.points);
  const pCur  = toNumberLoose(currentSelection.points);
  if (pPick != null && pCur != null && pPick === pCur){
    tr._cells.tdPts.innerHTML = renderValueWithBadge(String(picked.points), badgeGood("Points match current selection"));
  } else if (pPick != null && pCur != null){
    const dir = (pCur > pPick) ? "↑" : "↓";
    const tip = (pCur > pPick) ? "Current points are higher" : "Current points are lower";
    tr._cells.tdPts.innerHTML = renderValueWithBadge(String(picked.points), badgeArrow(dir, tip));
  } else {
    tr._cells.tdPts.innerHTML = renderValueWithBadge(String(picked.points), badgeBad("Points do not match current selection"));
  }
}

function fillRow(tr, row){
  const c = tr._cells;

  if (!row){
    c.tdPos.textContent = "—";
    c.tdAge.textContent = "—";
    c.tdPts.textContent = "—";
    c.tdConf.textContent= "—";
    c.tdDiv.textContent = "—";
    c.tdTeam.textContent= "—";
    for (const k of Object.keys(c)){
      c[k].className = "meta mutedText";
    }
    return;
  }

  // Before submit: show raw values (no badges)
  c.tdPos.textContent = row.position || "—";
  c.tdAge.textContent = row.age || "—";
  c.tdPts.textContent = row.points || "—";
  c.tdConf.textContent= row.conference || "—";
  c.tdDiv.textContent = row.division || "—";
  c.tdTeam.textContent= row.team || "—";

  for (const k of Object.keys(c)){
    c[k].className = "meta";
  }
}

function renderRows(){
  elRows.innerHTML = "";

  for (let i=1; i<=5; i++){
    const tr = document.createElement('tr');

    const tdPick = document.createElement('td');
    tdPick.innerHTML = `<span class="pickNum">${i}</span>`;
    tr.appendChild(tdPick);

const tdSel = document.createElement('td');

const wrap = document.createElement('div');
wrap.style.display = "flex";
wrap.style.gap = "10px";
wrap.style.alignItems = "center";

const input = document.createElement('input');
input.type = "text";
input.placeholder = "— type player name —";
input.setAttribute("list", `players_${i}`);
input.autocomplete = "off";
input.spellcheck = false;
input.style.width = "260px";
input.style.maxWidth = "100%";
input.style.background = "rgba(255,255,255,.07)";
input.style.border = "1px solid rgba(255,255,255,.16)";
input.style.color = "rgba(255,255,255,.92)";
input.style.padding = "10px 10px";
input.style.borderRadius = "14px";
input.style.outline = "none";

const dl = document.createElement('datalist');
dl.id = `players_${i}`;
dl.innerHTML = allNames.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');

wrap.appendChild(input);
wrap.appendChild(dl);
tdSel.appendChild(wrap);
tr.appendChild(tdSel);


    const tdPos = document.createElement('td'); tdPos.className="meta mutedText"; tdPos.textContent = "—"; tr.appendChild(tdPos);
    const tdAge = document.createElement('td'); tdAge.className="meta mutedText"; tdAge.textContent = "—"; tr.appendChild(tdAge);
    const tdPts = document.createElement('td'); tdPts.className="meta mutedText"; tdPts.textContent = "—"; tr.appendChild(tdPts);
    const tdConf= document.createElement('td'); tdConf.className="meta mutedText"; tdConf.textContent="—"; tr.appendChild(tdConf);
    const tdDiv = document.createElement('td'); tdDiv.className="meta mutedText"; tdDiv.textContent = "—"; tr.appendChild(tdDiv);
    const tdTeam= document.createElement('td'); tdTeam.className="meta mutedText"; tdTeam.textContent="—"; tr.appendChild(tdTeam);

    const tdBtn = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = "btn primary";
    btn.textContent = "Submit";
    btn.disabled = true;

    tdBtn.appendChild(btn);
    tr.appendChild(tdBtn);

    tr._cells = { tdPos, tdAge, tdPts, tdConf, tdDiv, tdTeam };
    tr._submitted = false;

function handlePickChange(){
  if (tr._submitted) return;

  const val = (input.value || "").trim();
  const row = dataByName.get(val);

  // Only populate meta + enable submit if the typed value matches a real player
  if (row){
    fillRow(tr, row);
    btn.disabled = false;
  } else {
    fillRow(tr, null);
    btn.disabled = true;
  }
}

input.addEventListener('input', handlePickChange);
input.addEventListener('change', handlePickChange);


    btn.addEventListener('click', async () => {
      if (tr._submitted) return;

const pickedName = (input.value || "").trim();
const pickedRow = dataByName.get(pickedName);
if (!pickedRow) return; // require an exact match from the list

      const sheetRow = i + 1; // row2..row6
      btn.disabled = true;
      btn.textContent = "Sending…";

      try{
        await sendSubmission({ player: PLAYER_KEY, row: sheetRow, name: pickedName });
        tr._submitted = true;

        input.disabled = true;

        compareAndMark(tr, pickedRow);

        btn.textContent = "Submitted ✓";
        toast(true, `Submitted pick #${i}: ${pickedName}`);
      }catch(e){
        console.error(e);
        btn.disabled = false;
        btn.textContent = "Submit";
        toast(false, "Submit failed (network/deploy).");
      }
    });

    elRows.appendChild(tr);
  }
}

// Submit: try normal fetch, fallback to Image ping (corporate-friendly)
async function sendSubmission(payload){
  const url = new URL(SCRIPT_WEB_APP_URL);
  url.searchParams.set("player", payload.player);
  url.searchParams.set("row", String(payload.row));
  url.searchParams.set("name", payload.name);
  url.searchParams.set("_", String(Date.now()));

  try{
    const resp = await fetch(url.toString(), { method: "GET", cache: "no-store" });
    const txt = await resp.text();
    const j = JSON.parse(txt);
    if (!j.ok) throw new Error(j.error || "Server error");
    return true;
  }catch{
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(true);
      img.src = url.toString();
      setTimeout(() => resolve(true), 1200);
    });
  }
}

async function init(){
  try{
    setStatus(true, "Loading…");
    elCurrentStatus.textContent = "Current Selection: loading…";

    const [picksText, dataRows, curRows] = await Promise.all([
      fetchText(PICKS_CSV_URL),
      parseCSV(DATA_CSV_URL),
      parseCSV(CURRENT_SELECTION_CSV_URL)
    ]);

    const grid = csvTextToGrid(picksText);
    elPlayerName.textContent = getA1FromGrid(grid, PLAYER_NAME_CELL) || "NATHAN";

    buildDataMap(dataRows);

    currentSelection = buildCurrentSelection(curRows);
    if (currentSelection){
      elCurrentStatus.textContent = "Current Selection: loaded";
    }else{
      elCurrentStatus.textContent = "Current Selection: not found";
    }

    renderRows();
    setStatus(true, "Ready");
  }catch(e){
    console.error(e);
    setStatus(false, "Load failed");
    elCurrentStatus.textContent = "Current Selection: load failed";
    toast(false, "Could not load CSVs (network policy?).");
  }
}

init();
